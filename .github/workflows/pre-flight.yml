name: Pre-flight (PR)

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - ".changeset/**"
      - "scripts/**"
      - "pnpm-workspace.yaml"
      - "package.json"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pre-flight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Pre-publish Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Charter gates
        run: |
          if [ -f "scripts/verify-pro.ts" ]; then
            pnpm verify-pro
          fi

      - name: Pre-publish check (non-blocking on PR)
        id: check
        continue-on-error: true
        run: |
          pnpm tsx scripts/pre-publish-check.ts --allow-warn --json-only > report.json || true
          if [ ! -s report.json ]; then
            echo '{"verdict":"no-go","results":[],"totalChecks":0,"passed":0,"failed":0,"warned":0,"skipped":0}' > report.json
          fi

      - name: Upload PR report
        uses: actions/upload-artifact@v4
        with:
          name: pre-publish-report-pr-${{ github.event.pull_request.number }}
          path: report.json

      - name: Comment PR with verdict
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('report.json', 'utf-8'));
            const icon = { 'go': '🟢', 'go-with-warnings': '🟡', 'no-go': '🔴' }[report.verdict] || '⚪';
            const fails = (report.results || []).filter(r => r.status === 'fail');
            const warns = (report.results || []).filter(r => r.status === 'warn');
            const failsBlock = fails.length > 0
              ? `\n### ❌ Blocking failures\n` + fails.map(f => `- **[${f.id}]** ${f.message}`).join('\n')
              : '';
            const warnsBlock = warns.length > 0
              ? `\n### ⚠️ Warnings\n` + warns.map(w => `- **[${w.id}]** ${w.message}`).join('\n')
              : '';
            const body = [
              `## ${icon} Pre-publish Check: \`${report.verdict.toUpperCase()}\``,
              ``,
              `| Metric | Value |`,
              `|---|---|`,
              `| Total checks | ${report.totalChecks} |`,
              `| ✅ Pass | ${report.passed} |`,
              `| ❌ Fail | ${report.failed} |`,
              `| ⚠️ Warn | ${report.warned} |`,
              `| ⏭️ Skip | ${report.skipped} |`,
              failsBlock,
              warnsBlock,
              ``,
              `<sub>This is non-blocking on PRs. Release workflow enforces strict pass.</sub>`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('Pre-publish Check'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
