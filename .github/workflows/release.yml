name: Release Pro

on:
  repository_dispatch:
    types: [oss-published]
  workflow_dispatch:
    inputs:
      oss_version:
        description: "OSS version that Pro depends on"
        required: true
        type: string
        default: "0.5.0"
      dry_run:
        description: "Dry run (validate but do not publish)"
        type: boolean
        default: true

concurrency:
  group: release-pro
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  issues: write

jobs:
  resolve-context:
    name: Resolve Release Context
    runs-on: ubuntu-latest
    outputs:
      oss_version: ${{ steps.ctx.outputs.oss_version }}
      dry_run: ${{ steps.ctx.outputs.dry_run }}
      triggered_by: ${{ steps.ctx.outputs.triggered_by }}
    steps:
      - name: Resolve inputs from dispatch source
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            OSS_VERSION="${{ github.event.client_payload.oss_version }}"
            DRY_RUN="${{ github.event.client_payload.dry_run }}"
            TRIGGERED_BY="${{ github.event.client_payload.triggered_by }}"
          else
            OSS_VERSION="${{ inputs.oss_version }}"
            DRY_RUN="${{ inputs.dry_run }}"
            TRIGGERED_BY="${{ github.actor }}"
          fi
          echo "oss_version=${OSS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          echo "triggered_by=${TRIGGERED_BY}" >> "$GITHUB_OUTPUT"
          echo "## Release Context" >> "$GITHUB_STEP_SUMMARY"
          echo "- OSS version: ${OSS_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dry run: ${DRY_RUN}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Triggered by: ${TRIGGERED_BY}" >> "$GITHUB_STEP_SUMMARY"

  pre-flight:
    name: Pre-flight (Pro)
    needs: resolve-context
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Wait for OSS on npm
        uses: ./.github/actions/wait-for-npm
        with:
          package: "@orqenix/core"
          version: ${{ needs.resolve-context.outputs.oss_version }}
          timeout-seconds: 600

      - name: Convert workspace deps to version ranges
        run: |
          pnpm tsx scripts/convert-cross-scope-deps.ts \
            --apply \
            --oss-version=${{ needs.resolve-context.outputs.oss_version }} \
            --version-range='^'

      - name: Re-install with converted deps
        run: pnpm install --no-frozen-lockfile

      - name: Run pre-publish-check
        id: check
        run: |
          pnpm tsx scripts/pre-publish-check.ts --json-only > .orqenix-pro/pre-publish-report.json
          VERDICT=$(jq -r '.verdict' .orqenix-pro/pre-publish-report.json)
          echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"
          if [ "${VERDICT}" = "no-go" ]; then
            jq '.results[] | select(.status == "fail")' .orqenix-pro/pre-publish-report.json
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_PRO }}

      - uses: actions/upload-artifact@v4
        with:
          name: pre-publish-report-pro-${{ github.run_id }}
          path: .orqenix-pro/pre-publish-report.json
          retention-days: 30

  build-and-verify:
    name: Build and Verify (Pro)
    needs: [resolve-context, pre-flight]
    if: needs.pre-flight.outputs.verdict != 'no-go'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Convert cross-scope deps
        run: |
          pnpm tsx scripts/convert-cross-scope-deps.ts \
            --apply \
            --oss-version=${{ needs.resolve-context.outputs.oss_version }}

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm verify-pro
      - run: pnpm -r --filter="./packages/*" exec npm pack --dry-run

  publish:
    name: Publish Pro to npm
    needs: [resolve-context, pre-flight, build-and-verify]
    if: needs.resolve-context.outputs.dry_run != 'true' && needs.pre-flight.outputs.verdict != 'no-go'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published_packages: ${{ steps.changesets.outputs.publishedPackages }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Convert cross-scope deps (final)
        run: |
          pnpm tsx scripts/convert-cross-scope-deps.ts \
            --apply \
            --oss-version=${{ needs.resolve-context.outputs.oss_version }}

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm build

      - name: Configure git
        run: |
          git config user.name "orqenix-pro-release-bot"
          git config user.email "bot@orqenix.dev"

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm ci:publish
          commit: "chore(release): version packages [Pro]"
          title: "chore(release): version packages [Pro]"
        env:
          GITHUB_TOKEN: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN_PRO }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Extract released version
        id: version
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(node -p "require('./packages/blast-radius/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Tag release
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}-phase-5"
          git tag -a "${TAG}" -m "Orqenix Pro Phase 5 release ${VERSION}"
          git push origin "${TAG}"

  combined-smoke:
    name: Combined Smoke Test (OSS + Pro)
    needs: [resolve-context, publish]
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for Pro npm propagation
        run: sleep 30

      - name: Install OSS + Pro together
        run: |
          mkdir -p /tmp/combined-smoke && cd /tmp/combined-smoke
          npm init -y >/dev/null
          npm install \
            @orqenix/core@${{ needs.resolve-context.outputs.oss_version }} \
            @orqenix-pro/blast-radius@${{ needs.publish.outputs.version }} \
            --no-fund --no-audit
          node -e "
            const core = require('@orqenix/core');
            const blastRadius = require('@orqenix-pro/blast-radius');
            console.log('OSS core loaded:', typeof core);
            console.log('Pro blast-radius loaded:', typeof blastRadius);
            console.log('Combined smoke: OK');
          "

  notify-completion:
    name: Notify Milo (Combined Release Done)
    needs: [resolve-context, publish, combined-smoke]
    if: always() && needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Comment on OSS release issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
          script: |
            const ossVersion = '${{ needs.resolve-context.outputs.oss_version }}';
            const proVersion = '${{ needs.publish.outputs.version }}';
            const packages = JSON.parse(`${{ needs.publish.outputs.published_packages }}` || '[]');
            const body = [
              `# Pro Release v${proVersion} Published`,
              ``,
              `Published **${packages.length}** @orqenix-pro/* packages depending on @orqenix/* v${ossVersion}.`,
              ``,
              `## Combined Release Status`,
              `| Repo | Version | Packages | Status |`,
              `|---|---|---|---|`,
              `| OSS | v${ossVersion} | 27 | ✅ Published |`,
              `| Pro | v${proVersion} | ${packages.length} | ✅ Published |`,
              ``,
              `## Verify Pro on npm`,
              packages.slice(0, 5).map(p => `- https://www.npmjs.com/package/${p.name}/v/${p.version}`).join('\n'),
              ``,
              `## Workflow run`,
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: 'milosaysyolo',
              repo: 'Orqenix',
              labels: 'awaiting-pro-trigger',
              state: 'open',
              sort: 'created',
              direction: 'desc',
              per_page: 1,
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: 'milosaysyolo',
                repo: 'Orqenix',
                issue_number: issues[0].number,
                body,
              });
              await github.rest.issues.removeLabel({
                owner: 'milosaysyolo',
                repo: 'Orqenix',
                issue_number: issues[0].number,
                name: 'awaiting-pro-trigger',
              });
              await github.rest.issues.addLabels({
                owner: 'milosaysyolo',
                repo: 'Orqenix',
                issue_number: issues[0].number,
                labels: ['release-complete'],
              });
            }
