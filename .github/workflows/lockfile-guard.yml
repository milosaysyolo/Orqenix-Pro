name: Lockfile Guard

on:
  pull_request:
    paths:
      - "**/package.json"
      - "pnpm-lock.yaml"
      - ".npmrc"
  push:
    branches: [main, release/**]
    paths:
      - "**/package.json"
      - "pnpm-lock.yaml"
      - ".npmrc"

permissions:
  contents: read

jobs:
  verify-lockfile:
    name: Verify pnpm-lock.yaml is in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Install yaml parser (for drift checker)
        run: npm install --no-save --no-package-lock yaml@2

      - name: Check lockfile drift (root deps vs lockfile)
        run: node scripts/release/check-lockfile-drift.mjs

      - name: Verify onlyBuiltDependencies allowlist
        run: node scripts/release/verify-only-built-deps.mjs

      - name: Verify lockfile passes --frozen-lockfile
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: pnpm install --frozen-lockfile --lockfile-only

      - name: Summary
        if: success()
        run: |
          echo "Lockfile is in sync with package.json"
          echo "onlyBuiltDependencies allowlist preserved"
          echo "Frozen-lockfile install succeeded"
