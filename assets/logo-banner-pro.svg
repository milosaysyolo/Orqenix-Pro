<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 880 220"
     width="880" height="220"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Orqenix-Pro</title>
  <desc id="desc">
    Orqenix-Pro banner. A mesh-node glyph on the left, the Orqenix wordmark
    with a small amber PRO badge, and a tagline reading
    "Production-grade extensions, BSL 1.1, converts to Apache 2.0 in 4 years".
  </desc>

  <defs>
    <!-- Mesh gradient, violet to cyan, used on the mark and accents -->
    <linearGradient id="mesh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7C3AED"/>
      <stop offset="55%"  stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Soft amber gradient for the PRO badge -->
    <linearGradient id="proBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Subtle vignette in the background -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%"   stop-color="#111833" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="1"/>
    </radialGradient>

    <!-- Soft glow filter for the mark, kept light to avoid GitHub render quirks -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="220" rx="28" fill="url(#vignette)"/>

  <!-- Decorative mesh dots, top-right quadrant -->
  <g opacity="0.18" fill="#94A3B8">
    <circle cx="720" cy="32"  r="1.6"/>
    <circle cx="752" cy="48"  r="1.2"/>
    <circle cx="788" cy="28"  r="1.8"/>
    <circle cx="824" cy="60"  r="1.4"/>
    <circle cx="760" cy="84"  r="1.0"/>
    <circle cx="836" cy="100" r="1.4"/>
    <circle cx="700" cy="68"  r="1.0"/>
  </g>

  <!-- ============================================================== -->
  <!--                          MESH MARK                              -->
  <!-- ============================================================== -->
  <g transform="translate(76,72)" filter="url(#softGlow)">
    <!-- Outer ring, mesh boundary -->
    <circle cx="38" cy="38" r="34" fill="none"
            stroke="url(#mesh)" stroke-width="3" opacity="0.9"/>

    <!-- Inner ring, scope boundary -->
    <circle cx="38" cy="38" r="22" fill="none"
            stroke="url(#mesh)" stroke-width="1.4" opacity="0.55"/>

    <!-- Edges from center to satellites -->
    <g stroke="url(#mesh)" stroke-width="1.4" opacity="0.65">
      <line x1="38" y1="38" x2="38"  y2="4"/>
      <line x1="38" y1="38" x2="68"  y2="22"/>
      <line x1="38" y1="38" x2="68"  y2="54"/>
      <line x1="38" y1="38" x2="38"  y2="72"/>
      <line x1="38" y1="38" x2="8"   y2="54"/>
      <line x1="38" y1="38" x2="8"   y2="22"/>
    </g>

    <!-- Central node, scope identity -->
    <circle cx="38" cy="38" r="6.5" fill="url(#mesh)"/>

    <!-- Satellite nodes, linked scopes -->
    <g fill="url(#mesh)">
      <circle cx="38" cy="4"  r="3.6"/>
      <circle cx="68" cy="22" r="3.0"/>
      <circle cx="68" cy="54" r="3.0"/>
      <circle cx="38" cy="72" r="3.6"/>
      <circle cx="8"  cy="54" r="3.0"/>
      <circle cx="8"  cy="22" r="3.0"/>
    </g>

    <!-- Delegation chain hint, an extra hop off the top node -->
    <g opacity="0.85">
      <line x1="38" y1="4" x2="56" y2="-12"
            stroke="#F59E0B" stroke-width="1.4"
            stroke-dasharray="2 2"/>
      <circle cx="56" cy="-12" r="2.4" fill="#F59E0B"/>
    </g>
  </g>

  <!-- ============================================================== -->
  <!--                           WORDMARK                              -->
  <!-- ============================================================== -->
  <g transform="translate(196,0)"
     font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">

    <!-- Orqenix -->
    <text x="0" y="120"
          font-size="68"
          font-weight="700"
          letter-spacing="-1.2"
          fill="#F8FAFC">Orqenix</text>

    <!-- PRO badge, amber pill, baseline-aligned with cap height -->
    <g transform="translate(296,62)">
      <rect x="0" y="0" width="86" height="34" rx="17"
            fill="url(#proBadge)"/>
      <rect x="0" y="0" width="86" height="34" rx="17"
            fill="none" stroke="#92400E" stroke-opacity="0.35"
            stroke-width="1"/>
      <text x="43" y="23"
            text-anchor="middle"
            font-size="18"
            font-weight="800"
            letter-spacing="2.6"
            fill="#1F1408">PRO</text>
    </g>

    <!-- Tagline, line 1 -->
    <text x="2" y="156"
          font-size="18"
          font-weight="500"
          fill="#CBD5E1">
      Production-grade extensions for Orqenix
    </text>

    <!-- Tagline, line 2, soft warning band tone -->
    <text x="2" y="180"
          font-size="14"
          font-weight="400"
          fill="#94A3B8">
      BSL 1.1, converts to Apache 2.0 in 4 years
    </text>
  </g>

  <!-- ============================================================== -->
  <!--                       BOTTOM ACCENT BAR                         -->
  <!-- ============================================================== -->
  <rect x="0" y="216" width="880" height="4" rx="2" fill="url(#mesh)" opacity="0.85"/>
</svg>
